[project]
name = "miniserve"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"     # async test functions run without a per-test decorator

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
exclude = ["reading", ".venv"]

[tool.ruff]
extend-exclude = ["reading"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "C4"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
