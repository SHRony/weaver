[project]
name = "weaver"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"     # async test functions run without a per-test decorator

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
exclude = ["reading", "notes", ".venv"]   # notes/ = gitignored scratch, not project code

[tool.ruff]
extend-exclude = ["reading", "notes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "C4"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "transformers>=5.17.0",
]
